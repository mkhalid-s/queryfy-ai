# Alembic Configuration for QueryfyAI Data Dictionary
#
# Run migrations:
#   alembic upgrade head      - Apply all pending migrations
#   alembic downgrade -1      - Rollback one migration
#   alembic revision --autogenerate -m "description"  - Create new migration
#
# Note: DATABASE_URL must be set in environment or .env file

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path with the current directory
prepend_sys_path = .

# Timezone for file_template revision tokens
# timezone =

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run environment during standard migrations
# revision_environment = false

# Set to 'true' to enable batch mode for autogenerate
# sourceless = false

# Version location specification
version_locations = %(here)s/alembic/versions

# The output encoding used when writing files
output_encoding = utf-8

# Database URL - will be overridden by env.py from settings
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# Post-write hooks for auto-formatting migrations
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
