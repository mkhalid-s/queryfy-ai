[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests (require external services)
    slow: Slow tests
    data_lake_integration: Tests requiring docker-compose.integration.yml running (BigQuery emulator / Trino / MinIO)
    requires_bigquery_emulator: Skipped unless BQ emulator reachable on BIGQUERY_EMULATOR_URL
    requires_trino: Skipped unless Trino reachable on TRINO_URL
    requires_real_bigquery: Skipped unless GOOGLE_APPLICATION_CREDENTIALS + BIGQUERY_PROJECT set
    requires_real_snowflake: Skipped unless SNOWFLAKE_ACCOUNT + SNOWFLAKE_USER + SNOWFLAKE_PASSWORD set
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
