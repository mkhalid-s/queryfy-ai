name: sandbox
description: >
  Sandbox benchmark — runs BIRD Mini-Dev against SQLite (native),
  PostgreSQL, and MySQL, plus MongoDB NL-to-Mongosh.
  Requires docker-compose.sandbox.yml to be running.

# LLM configuration — provider/model resolved from environment variables.
# Supports all 15 providers configured in the app.
llm:
  provider: ${BENCHMARK_LLM_PROVIDER:-openai}
  model: ${BENCHMARK_LLM_MODEL:-gpt-4o-mini}
  api_key_env: ${BENCHMARK_LLM_API_KEY_ENV:-OPENAI_API_KEY}
  temperature: 0.0
  max_tokens: 2048

data_dir: benchmarks/data
output_dir: benchmarks/results
max_concurrent: 2
generator_mode: direct

suites:
  # ------------------------------------------------------------------
  # BIRD Mini-Dev — Native SQLite (baseline)
  # ------------------------------------------------------------------
  - name: bird-sqlite
    dataset: bird-mini-dev
    db_type: sql
    max_cases: 20
    metrics:
      - exact_match
      - execution_accuracy
    tags: [sandbox, sqlite, baseline]

  # ------------------------------------------------------------------
  # BIRD Mini-Dev — PostgreSQL (cross-dialect)
  # ------------------------------------------------------------------
  - name: bird-postgresql
    dataset: bird-mini-dev
    db_type: postgresql
    max_cases: 20
    transpile_from: sqlite
    connection_url: ${BENCHMARK_PG_URL:-postgresql://benchmark:benchmark123@localhost:15432/benchmark_db}
    metrics:
      - exact_match
      - dialect_accuracy
      - execution_accuracy
    tags: [sandbox, postgresql, cross-dialect]

  # ------------------------------------------------------------------
  # BIRD Mini-Dev — MySQL (cross-dialect)
  # ------------------------------------------------------------------
  - name: bird-mysql
    dataset: bird-mini-dev
    db_type: mysql
    max_cases: 20
    transpile_from: sqlite
    connection_url: ${BENCHMARK_MYSQL_URL:-mysql://benchmark:benchmark123@localhost:13306/benchmark_db}
    metrics:
      - exact_match
      - dialect_accuracy
      - execution_accuracy
    tags: [sandbox, mysql, cross-dialect]

  # ------------------------------------------------------------------
  # MongoDB NL-to-Mongosh
  # ------------------------------------------------------------------
  - name: mongodb-sandbox
    dataset: mongodb-nl-to-mongosh
    db_type: nosql_document
    max_cases: 10
    connection_url: ${BENCHMARK_MONGO_URL:-mongodb://benchmark:benchmark123@localhost:27018/}
    metrics:
      - exact_match
    tags: [sandbox, mongodb]
