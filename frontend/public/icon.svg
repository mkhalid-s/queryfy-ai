<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- QueryfyAI App Icon: High-resolution for PWA and touch icons -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00739d"/>
      <stop offset="100%" style="stop-color:#038898"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1eb7df"/>
      <stop offset="100%" style="stop-color:#26d1a0"/>
    </linearGradient>
    <!-- Subtle inner shadow for depth -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feComposite in="SourceGraphic" in2="offsetBlur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="96" fill="url(#bgGradient)"/>

  <!-- Subtle border for visibility -->
  <rect x="4" y="4" width="504" height="504" rx="92" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>

  <!-- Chat bubble (representing natural language input) -->
  <path d="M80 140C80 117.909 97.909 100 120 100H290C312.091 100 330 117.909 330 140V230C330 252.091 312.091 270 290 270H180L115 325V270H120C97.909 270 80 252.091 80 230V140Z" fill="white" fill-opacity="0.95"/>

  <!-- SQL angle brackets (representing code/query) -->
  <path d="M370 175L420 235L370 295" stroke="white" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Database cylinder -->
  <ellipse cx="310" cy="370" rx="90" ry="35" fill="white" fill-opacity="0.95"/>
  <path d="M220 370V430C220 450 260 466 310 466C360 466 400 450 400 430V370" stroke="white" stroke-width="20" fill="none"/>
  <ellipse cx="310" cy="430" rx="90" ry="35" fill="none" stroke="white" stroke-width="10" opacity="0.4"/>

  <!-- Connection arrow (NL to SQL flow) -->
  <path d="M200 320L250 370" stroke="url(#accentGradient)" stroke-width="16" stroke-linecap="round" opacity="0.8"/>

  <!-- AI sparkles (representing intelligence) -->
  <circle cx="150" cy="165" r="18" fill="#ffc000"/>
  <circle cx="255" cy="190" r="12" fill="#ffc000"/>
  <circle cx="190" cy="145" r="8" fill="#ffc000"/>

  <!-- Additional sparkle for visual balance -->
  <circle cx="420" cy="140" r="14" fill="#ffc000" opacity="0.8"/>
</svg>
