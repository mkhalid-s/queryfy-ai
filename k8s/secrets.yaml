# ============================================================================
# QueryfyAI - Kubernetes Secrets Configuration
# ============================================================================
# IMPORTANT: This is a TEMPLATE file. Do NOT commit actual secrets to git!
#
# Usage:
#   1. Copy this file: cp secrets.yaml secrets.prod.yaml
#   2. Replace placeholder values with base64-encoded secrets
#   3. Apply: kubectl apply -f secrets.prod.yaml
#
# To encode secrets:
#   echo -n "your-secret-value" | base64
#
# Or use kubectl to create secrets directly:
#   kubectl create secret generic queryfyai-secrets \
#     --from-literal=database-url='postgresql://...' \
#     --from-literal=redis-url='redis://...'
# ============================================================================

---
apiVersion: v1
kind: Secret
metadata:
  name: queryfyai-secrets
  labels:
    app: queryfyai
type: Opaque
stringData:
  # PostgreSQL connection URL
  # Format: postgresql://user:password@host:port/database
  database-url: "postgresql://queryfyai:CHANGE_ME@postgres:5432/queryfyai"

  # Redis connection URL
  # Format: redis://[:password@]host:port/db
  redis-url: "redis://redis:6379/0"

  # Session signing secret (for JWT/session tokens)
  # Generate with: python3 -c "import secrets; print(secrets.token_hex(32))"
  session-secret: "CHANGE_ME_TO_A_RANDOM_64_CHAR_HEX_STRING"

  # LLM API Key (for OpenAI, Anthropic, etc.)
  # Leave empty if using OAuth gateway
  llm-api-key: ""

  # LLM OAuth Client Secret (for OAuth gateway)
  # Leave empty if using direct API key
  llm-client-secret: ""

  # Qdrant API Key (optional - for Qdrant Cloud)
  # Leave empty if using local Qdrant or ChromaDB
  qdrant-api-key: ""

---
