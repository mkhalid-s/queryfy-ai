# ============================================================================
# QueryfyAI - Kubernetes Frontend Deployment
# ============================================================================
# Frontend web application deployment with Nginx
# ============================================================================

---
# ============================================================================
# CONFIGMAP - Frontend Configuration
# ============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: queryfyai-frontend-config
  labels:
    app: queryfyai
    component: frontend
data:
  # Nginx configuration for SPA routing and API proxy
  default.conf: |
    # Rate limiting zone
    limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=frontend_conn:10m;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

        # Rate limiting
        limit_req zone=frontend_limit burst=50 nodelay;
        limit_conn frontend_conn 20;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 'healthy';
            add_header Content-Type text/plain;
        }

        # Static assets with long cache
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # API proxy to backend service
        location /api/ {
            proxy_pass http://queryfyai-backend:8000/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # SPA fallback - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;

            # No cache for HTML (SPA shell)
            location ~* \.html$ {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }

        # Deny access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

---
# ============================================================================
# DEPLOYMENT - Frontend
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: queryfyai-frontend
  labels:
    app: queryfyai
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: queryfyai
      component: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: queryfyai
        component: frontend
      annotations:
        prometheus.io/scrape: "false"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101

      containers:
      - name: frontend
        image: queryfyai/frontend:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP

        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL

        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run

      volumes:
      - name: nginx-config
        configMap:
          name: queryfyai-frontend-config
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}

      # Pod topology spread for high availability
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: queryfyai
            component: frontend

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: queryfyai
                  component: frontend
              topologyKey: kubernetes.io/hostname

---
# ============================================================================
# SERVICE - Frontend
# ============================================================================
apiVersion: v1
kind: Service
metadata:
  name: queryfyai-frontend
  labels:
    app: queryfyai
    component: frontend
spec:
  type: ClusterIP
  selector:
    app: queryfyai
    component: frontend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP

---
# ============================================================================
# HORIZONTAL POD AUTOSCALER - Frontend
# ============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: queryfyai-frontend-hpa
  labels:
    app: queryfyai
    component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: queryfyai-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 2
        periodSeconds: 15
      selectPolicy: Max

---
# ============================================================================
# POD DISRUPTION BUDGET - Frontend
# ============================================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: queryfyai-frontend-pdb
  labels:
    app: queryfyai
    component: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: queryfyai
      component: frontend
