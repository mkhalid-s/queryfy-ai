# ============================================================================
# QueryfyAI - Kubernetes Monitoring Configuration
# ============================================================================
# Includes: ServiceMonitor, PrometheusRule, Grafana Dashboard ConfigMap
# Requires: Prometheus Operator installed in cluster
# ============================================================================

---
# ============================================================================
# SERVICE MONITOR - Backend Metrics
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: queryfyai-backend-monitor
  labels:
    app: queryfyai
    component: backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: queryfyai
      component: backend
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
  namespaceSelector:
    matchNames:
    - queryfyai

---
# ============================================================================
# PROMETHEUS RULES - Alerting Rules
# ============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: queryfyai-alerts
  labels:
    app: queryfyai
    release: prometheus
spec:
  groups:
  - name: queryfyai.rules
    rules:
    # High Error Rate Alert
    - alert: QueryfyAIHighErrorRate
      expr: |
        (
          sum(rate(http_requests_total{service="queryfyai-backend",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{service="queryfyai-backend"}[5m]))
        ) > 0.05
      for: 5m
      labels:
        severity: critical
        service: queryfyai
      annotations:
        summary: "High error rate detected in QueryfyAI"
        description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes"

    # High Latency Alert
    - alert: QueryfyAIHighLatency
      expr: |
        histogram_quantile(0.95,
          sum(rate(http_request_duration_seconds_bucket{service="queryfyai-backend"}[5m])) by (le)
        ) > 5
      for: 10m
      labels:
        severity: warning
        service: queryfyai
      annotations:
        summary: "High latency detected in QueryfyAI"
        description: "95th percentile latency is {{ $value | humanizeDuration }}"

    # Pod Not Ready Alert
    - alert: QueryfyAIPodNotReady
      expr: |
        kube_deployment_status_replicas_ready{deployment="queryfyai-backend"}
        <
        kube_deployment_spec_replicas{deployment="queryfyai-backend"}
      for: 5m
      labels:
        severity: warning
        service: queryfyai
      annotations:
        summary: "QueryfyAI pods not ready"
        description: "{{ $value }} pods are not ready"

    # High Memory Usage Alert
    - alert: QueryfyAIHighMemoryUsage
      expr: |
        (
          container_memory_working_set_bytes{container="backend",pod=~"queryfyai-backend.*"}
          /
          container_spec_memory_limit_bytes{container="backend",pod=~"queryfyai-backend.*"}
        ) > 0.85
      for: 10m
      labels:
        severity: warning
        service: queryfyai
      annotations:
        summary: "High memory usage in QueryfyAI"
        description: "Memory usage is {{ $value | humanizePercentage }}"

    # High CPU Usage Alert
    - alert: QueryfyAIHighCPUUsage
      expr: |
        (
          sum(rate(container_cpu_usage_seconds_total{container="backend",pod=~"queryfyai-backend.*"}[5m]))
          /
          sum(container_spec_cpu_quota{container="backend",pod=~"queryfyai-backend.*"} / 100000)
        ) > 0.85
      for: 10m
      labels:
        severity: warning
        service: queryfyai
      annotations:
        summary: "High CPU usage in QueryfyAI"
        description: "CPU usage is {{ $value | humanizePercentage }}"

    # Redis Connection Failure
    - alert: QueryfyAIRedisDown
      expr: redis_up{service="redis"} == 0
      for: 2m
      labels:
        severity: critical
        service: queryfyai
      annotations:
        summary: "Redis is down"
        description: "Redis service is not responding"

    # PostgreSQL Connection Failure
    - alert: QueryfyAIPostgresDown
      expr: pg_up{service="postgres"} == 0
      for: 2m
      labels:
        severity: critical
        service: queryfyai
      annotations:
        summary: "PostgreSQL is down"
        description: "PostgreSQL service is not responding"

    # LLM API Latency
    - alert: QueryfyAILLMHighLatency
      expr: |
        histogram_quantile(0.95,
          sum(rate(llm_request_duration_seconds_bucket{service="queryfyai-backend"}[5m])) by (le)
        ) > 30
      for: 5m
      labels:
        severity: warning
        service: queryfyai
      annotations:
        summary: "LLM API high latency"
        description: "LLM API 95th percentile latency is {{ $value | humanizeDuration }}"

