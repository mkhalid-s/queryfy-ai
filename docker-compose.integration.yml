# ==========================================================================
# QueryfyAI — Integration Test Infrastructure
# ==========================================================================
# Spins up local emulators / stand-ins for the data-lake engines QueryfyAI
# supports, so Phase 3b driver code (BigQuery async executor, Snowflake
# async executor, Trino/Athena-like) can be validated without real cloud
# credentials.
#
# Usage:
#   docker compose -f docker-compose.integration.yml up -d
#   cd backend && pytest -m data_lake_integration
#   docker compose -f docker-compose.integration.yml down -v
#
# Services:
#   - bigquery-emulator  → BigQuery-compatible HTTP API on :9050
#                          goccy/bigquery-emulator (open source)
#   - minio              → S3-compatible object storage (for Trino)
#                          :9000 API, :9001 console
#   - trino              → Distributed SQL engine (Athena / Presto stand-in)
#                          :8089 HTTP coordinator
#
# NOT covered here (cloud-only or require licenses):
#   - Real BigQuery (use gcloud auth + project in Phase 3b.3 integration tests)
#   - Snowflake (cloud only; use real account in 3b.4 integration tests)
#   - Databricks (cloud only)
#   - Redshift (AWS only)
#   - Spark/Hive (use docker-compose.analytics.yml if needed)
# ==========================================================================

version: '3.8'

services:
  # ------------------------------------------------------------------
  # BigQuery emulator — Phase 3b.3 target
  # ------------------------------------------------------------------
  # goccy/bigquery-emulator implements the BigQuery REST API on top of
  # SQLite (queries) + an in-memory metadata store. Good enough for
  # validating QueryJob lifecycle, dry_run cost estimation, and async
  # polling behaviour. NOT a substitute for real BigQuery (missing
  # partitioning features, UDFs, IAM, billing). Gate expensive
  # behaviours behind real-cred tests.
  bigquery-emulator:
    image: ghcr.io/goccy/bigquery-emulator:0.6.7
    container_name: queryfyai-bigquery-emu
    command:
      - "--project=test-project"
      - "--dataset=test_dataset"
      - "--port=9050"
    ports:
      - "9050:9050"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://localhost:9050/discovery/v1/apis/bigquery/v2/rest >/dev/null || exit 1"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # ------------------------------------------------------------------
  # MinIO — S3-compatible storage backing Trino
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: queryfyai-minio-int
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    volumes:
      - minio_integration:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # One-shot bucket bootstrap so Trino has somewhere to land objects.
  minio-bootstrap:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: queryfyai-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin;
        mc mb -p local/integration || true;
        echo 'MinIO bootstrap complete';
      "
    restart: "no"

  # ------------------------------------------------------------------
  # Trino — Athena-like SQL engine for integration tests
  # ------------------------------------------------------------------
  # Single-node coordinator+worker. Uses the memory connector (no disk
  # state) so tests get a clean slate on every compose up. Configured
  # via ./data/trino-integration-etc which is checked in.
  trino:
    image: trinodb/trino:456
    container_name: queryfyai-trino-int
    ports:
      - "8089:8080"  # 8080 is often taken in dev; use 8089 for integration
    volumes:
      - ./data/trino-integration-etc:/etc/trino:ro
    depends_on:
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  minio_integration:
